[project]
name = "mika-voice-server"
version = "0.1.0"
description = "Local open-source speech-to-text and text-to-speech for Mika, with an OpenAI-style audio API."
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "soundfile>=0.12",
    # Speech-to-text: Whisper on Apple Silicon's GPU
    "mlx-whisper>=0.4",
    # Text-to-speech: Kokoro for English/Hindi/etc., Meta MMS for other scripts
    "kokoro>=0.9.4",
    "transformers>=4.45",
    "torch>=2.4",
    "uroman>=1.3",
]

[tool.uv]
package = false
